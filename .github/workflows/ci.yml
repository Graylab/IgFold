name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          environments: dev
      - name: Cache Hugging Face Hub downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-antiberty-${{ runner.os }}
      - name: Lint
        run: pixi run -e dev pre-commit run --all-files --show-diff-on-failure
      - name: Test
        run: pixi run -e dev pytest -q
